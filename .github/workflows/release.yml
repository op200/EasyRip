name: Build

on:
  push:
    paths:
      - "easyrip/**"
      - "resources/*.ico"
      - "pyproject.toml"
      - ".github/workflows/*"
    branches: ["main"]
  pull_request:
    paths:
      - "easyrip/**"
      - "resources/*.ico"
      - "pyproject.toml"
      - ".github/workflows/*"
    branches: ["main"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build - Windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
      - run: pip install -U . && pip install -U nuitka

      - name: Build - zipapp
        run: |
          $build = Join-Path $PWD "_build"

          Remove-Item $build -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path .\easyrip -Destination "$build\easyrip" -Recurse -Force

          python -m compileall -f "$build\easyrip"
          python -m zipapp $build --output easyrip.pyz --compress -m easyrip.__main__:run

          Remove-Item $build -Recurse -Force

      - name: Upload pyz
        uses: actions/upload-artifact@v7
        with:
          name: easyrip.pyz
          path: ./easyrip.pyz

      - name: Build - nuitka
        run: |
          python -m nuitka --standalone --onefile --assume-yes-for-downloads --plugin-enable=tk-inter --windows-icon-from-ico=resources/ER.ico -o easyrip --output-dir=./easyrip_nuitka_output --python-flag=-m easyrip

      - name: exe -> 7z
        run: |
          7z a -t7z -m0=LZMA2 -mx=9 -mfb=273 easyrip.exe.7z ./easyrip_nuitka_output/*.exe

      - name: Upload exe.7z
        uses: actions/upload-artifact@v7
        with:
          name: easyrip.exe
          path: ./easyrip.exe.7z

      - name: Upload build files to Release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./easyrip.pyz
            ./easyrip.exe.7z
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi-publish:
    name: Upload release to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Build distributions
        run: |
          python -m pip install -U build
          python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
